name: Check tax rules
on:
  schedule:
    - cron: '17 6 * * 1'   # every Monday 06:17 UTC (picks up April changes within a week)
  workflow_dispatch:
  push:
    paths: ['scripts/update_rules.py', '.github/workflows/rules.yml']
permissions:
  contents: write
concurrency: rules
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_rules.py rules.json --debug
      - name: Save rules
        run: |
          git config user.name "rules-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules.json
          git diff --cached --quiet || (git commit -m "Update tax rules" && git pull --quiet --rebase origin main && git push)
