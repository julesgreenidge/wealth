name: Update YNAB figures
on:
  schedule:
    - cron: '15 5 * * *'   # every day, early morning UK time
  workflow_dispatch:
  push:
    paths: ['scripts/update_ynab.py', '.github/workflows/ynab.yml']
permissions:
  contents: write
concurrency: ynab
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pandas cryptography
      - run: python scripts/update_ynab.py
        env:
          YNAB_TOKEN: ${{ secrets.YNAB_TOKEN }}
      - name: Save sealed figures
        run: |
          git config user.name "ynab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f ynab.enc ]; then git add ynab.enc; fi
          git diff --cached --quiet || (git commit -m "Update YNAB figures" && git pull --quiet --rebase origin main && git push)
