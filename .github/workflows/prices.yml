name: Update prices
on:
  schedule:
    - cron: '30 21 * * 1-5'   # weekdays 21:30 UTC, after US markets close
  workflow_dispatch:
  push:
    paths: ['scripts/update_prices.py', 'scripts/update_history.py', 'scripts/update_rpi.py', '.github/workflows/prices.yml']
permissions:
  contents: write
concurrency: prices
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_prices.py prices.json
      - run: python scripts/update_history.py prices.json history.json
        continue-on-error: true
      - run: python scripts/update_rpi.py rpi.json
        continue-on-error: true
      - name: Save prices
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json; if [ -f history.json ]; then git add history.json; fi; if [ -f rpi.json ]; then git add rpi.json; fi
          git diff --cached --quiet || (git commit -m "Update prices" && git pull --quiet --rebase origin main && git push)
