name: Update fund make-up
on:
  schedule:
    - cron: '40 6 8 * *'   # 8th of each month, 06:40 UTC (factsheets for the previous month-end are out by then)
  workflow_dispatch:
  push:
    paths: ['scripts/update_funds.py', 'scripts/fund_pages.js', '.github/workflows/funds.yml']
permissions:
  contents: write
concurrency: funds
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1, pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, pinned
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -q poppler-utils >/dev/null
      - run: npm i --no-save playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: node scripts/fund_pages.js /tmp/fid.json || echo '{}' > /tmp/fid.json
      - name: Update funds.json and save
        run: |
          set +e
          python scripts/update_funds.py funds.json /tmp/fid.json; s=$?
          git config user.name "funds-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funds.json
          git diff --cached --quiet || (git commit -m "Update fund make-up" && git pull --quiet --rebase -X theirs origin main && git push)
          exit $s
