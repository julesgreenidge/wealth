<title>Wealth</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--fg:#1d1d1b;--muted:#6b6a65;--line:#e4e2db;--neg:#c2413b}

*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}

p{color:var(--muted);font-size:13px;margin:0 0 18px}

.chk{display:flex;gap:8px;align-items:center;margin-bottom:16px}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--fg);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--neg);font-size:13px;min-height:20px;margin-top:10px}
</style>

<script>
(async function(){
const P=JSON.parse(document.getElementById('payload').textContent);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function open(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromRaw(raw){return crypto.subtle.importKey('raw',ub(raw),'AES-GCM',true,['decrypt'])}
// saved key (same password, same salt) - try silently
for(const st of [sessionStorage,localStorage]){
  try{const s=JSON.parse(st.getItem('wealth-key')||'null');if(s&&s.salt===P.salt){await open(await fromRaw(s.k));return}}catch(e){}
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.onsubmit=async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Unlocking…';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
    const raw=bu(await crypto.subtle.exportKey('raw',key));
    await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct));
    const rec=JSON.stringify({salt:P.salt,k:raw});
    try{sessionStorage.setItem('wealth-key',rec);if(document.getElementById('rem').checked)localStorage.setItem('wealth-key',rec)}catch(e){}
    await open(key);
  }catch(x){err.textContent='That password didn’t work. Try again.';go.disabled=false;go.textContent='Unlock';}
};
})();
</script>
