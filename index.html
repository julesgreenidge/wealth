<title>Wealth</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--fg:#1d1d1b;--muted:#6b6a65;--line:#e4e2db;--neg:#c2413b}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#201f1d;--fg:#f0efe9;--muted:#a4a29a;--line:#34332f;--neg:#ef7a72}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px}
form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:360px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 4px}
p{color:var(--muted);font-size:13px;margin:0 0 18px}
label{font-size:13px;color:var(--muted)}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:10px 12px;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:16px}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--fg);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0;opacity:0}
.err{color:var(--neg);font-size:13px;min-height:20px;margin-top:10px}
</style>

<script>
(async function(){
const P=JSON.parse(document.getElementById('payload').textContent);
if(!window.crypto||!crypto.subtle){
  const https='https://'+location.host+location.pathname;
  document.getElementById('f').innerHTML='<h1>Wealth</h1><p>This page needs a secure (https) connection to unlock, and this one isn\u2019t secure yet.</p><p><a href="'+https+'" style="color:inherit;font-weight:600">Open the secure version</a></p><p>If that link shows a warning, GitHub is still setting up the secure certificate. Try again in an hour, after ticking <b>Enforce HTTPS</b> in your repo\u2019s Pages settings.</p>';
  return;
}
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function open(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
function norm(v){v=v.toLowerCase().replace(/[\s`'"]/g,'').replace(/[\u2010-\u2015\u2212_.]/g,'-');if(!v.includes('-')&&v.length===20)v=v.match(/.{5}/g).join('-');return v}
async function fromRaw(raw){return crypto.subtle.importKey('raw',ub(raw),'AES-GCM',true,['decrypt'])}
// saved key (same password, same salt) - try silently
for(const st of [sessionStorage,localStorage]){
  try{const s=JSON.parse(st.getItem('wealth-key')||'null');if(s&&s.salt===P.salt){await open(await fromRaw(s.k));return}}catch(e){}
}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.onsubmit=async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Unlocking…';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(document.getElementById('pw').value)),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
    const raw=bu(await crypto.subtle.exportKey('raw',key));
    await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct));
    const rec=JSON.stringify({salt:P.salt,k:raw});
    let saved=false;try{sessionStorage.setItem('wealth-key',rec);saved=sessionStorage.getItem('wealth-key')===rec;if(document.getElementById('rem').checked)localStorage.setItem('wealth-key',rec)}catch(e){}
    if(saved){location.replace(location.href.split('#')[0]);return}
    await open(key);
  }catch(x){err.textContent='That password didn’t work. Try again.';go.disabled=false;go.textContent='Unlock';}
};
})();
</script>
